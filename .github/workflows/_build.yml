name: _build
run-name: Build

on:
  workflow_call:
    inputs:
        release_version:
            description: 'Release version'
            required: false
            type: string
            default: ''

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate diagnostics configuration for publishing
        if: inputs.release_version != ''
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "Set the SENTRY_DSN repository variable before publishing."
            exit 1
          fi

      - name: Build
        run: ./gradlew build
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Rename apk
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/karoo-camera-control.apk

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: karoo-camera-control.apk
          path: app/build/outputs/apk/release/karoo-camera-control.apk
          if-no-files-found: error

      - name: Preserve release obfuscation mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obfuscation-mapping-${{ inputs.release_version || github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
