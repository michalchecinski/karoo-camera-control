name: Reset release type

on:
  release:
    types:
      - published

jobs:
  reset-release-type:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Reset release type to patch
        run: |
          echo "patch" > .github/release-type.txt

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          if [[ -n $(git status -s .github/release-type.txt) ]]; then
            git add .github/release-type.txt
            git commit -m "Reset release type to patch [skip ci]"
            git push origin main
          else
            echo "No changes to commit (already patch)"
          fi
